<svg xmlns="http://www.w3.org/2000/svg" width="160" height="120" viewBox="0 0 160 120" fill="none">
  <title>Hidden channel configurator</title>
  <desc>A wooden column seated on an andesite foot, with a brass collar supporting a miniature glass beacon.</desc>
  <g stroke="#30393b" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <g id="andesite-foot-top">
      <polygon points="5.45,98.75 26.45,98.75 34.85,92.45 13.85,92.45" fill="#a8b3ab"/>
    </g>
    <g id="wooden-handle">
      <polygon points="7.55,53.3 25.55,53.3 25.55,98.3 7.55,98.3" fill="#9f744c"/>
      <polygon points="25.55,53.3 32.75,47.9 32.75,92.9 25.55,98.3" fill="#785536"/>
      <path d="M12.05 56.3v38.4m8.1-38.4v38.4" stroke="#c29b6b" stroke-width="1.4"/>
      <path d="M29.15 53.6v37.8" stroke="#977043" stroke-width="1"/>
    </g>
    <g id="andesite-foot-rim">
      <polygon points="26.45,104.75 34.85,98.45 34.85,92.45 26.45,98.75" fill="#737c76"/>
      <polygon points="5.45,104.75 26.45,104.75 26.45,98.75 5.45,98.75" fill="#929a94"/>
      <path d="M7.55 100.5h16.8" stroke="#c1cac2" stroke-width="1"/>
      <path d="M27.7 102.3 33.5 97.95" stroke="#626f67" stroke-width="1"/>
    </g>
    <g id="brass-ring">
      <polygon points="1.25,54.65 28.25,54.65 28.25,45.65 1.25,45.65" fill="#c69a52"/>
      <polygon points="28.25,54.65 39.05,46.55 39.05,37.55 28.25,45.65" fill="#946f3e"/>
      <polygon points="1.25,45.65 28.25,45.65 39.05,37.55 12.05,37.55" fill="#e5c78b"/>
    </g>
    <g id="beacon-base">
      <polygon points="7.55,44.15 25.55,44.15 25.55,39.8 7.55,39.8" fill="#414652"/>
      <polygon points="25.55,44.15 32.75,38.75 32.75,34.4 25.55,39.8" fill="#2b343d"/>
      <polygon points="7.55,39.8 25.55,39.8 32.75,34.4 14.75,34.4" fill="#5b6470"/>
    </g>
    <g id="beacon-core">
      <polygon points="9.65,39.35 24.65,39.35 24.65,22.85 9.65,22.85" fill="#6dc6b3"/>
      <polygon points="24.65,39.35 30.65,34.85 30.65,18.35 24.65,22.85" fill="#4b9c91"/>
      <polygon points="9.65,22.85 24.65,22.85 30.65,18.35 15.65,18.35" fill="#b3ebd5"/>
    </g>
    <g id="beacon-glass">
      <polygon points="3.35,45.2 27.35,45.2 27.35,21.2 3.35,21.2" fill="#c3e6dd" fill-opacity=".18"/>
      <polygon points="27.35,45.2 36.95,38 36.95,14 27.35,21.2" fill="#9ecfc6" fill-opacity=".18"/>
      <polygon points="3.35,21.2 27.35,21.2 36.95,14 12.95,14" fill="#ddf4ec" fill-opacity=".18"/>
    </g>
    <path d="M5.45 39.20 5.45 23.30" stroke="#eefbf2" stroke-width="1.2"/>
    <path d="M5.45 23.30 10.85 23.30" stroke="#eefbf2" stroke-width="1.2"/>
  </g>
</svg>
